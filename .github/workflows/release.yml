name: Release

# Push a tag vX.Y.Z on main. The version must match package.json and have a "## X.Y.Z (date)" section in CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "Tag $TAG does not match package.json $PKG"; exit 1; }
          grep -q "^## $TAG (" CHANGELOG.md || { echo "CHANGELOG.md has no '## $TAG (date)' section"; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vsce package -o testmd-${{ github.ref_name }}.vsix

      - name: Publish to the VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --packagePath testmd-${{ github.ref_name }}.vsix

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: |
          npx ovsx create-namespace bizjaya || true  # once; already there on later releases
          npx ovsx publish testmd-${{ github.ref_name }}.vsix

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v v="$TAG" '$0 ~ "^## "v" \\(" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" testmd-${{ github.ref_name }}.vsix --title "TestMD $TAG" --notes-file notes.md
